name: Build and Release CheckSpoof

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        run: |
          go build -v -o checkspoof main.go

      - name: Release Binary
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: CheckSpoof Release v1.0.${{ github.run_number }}
          files: checkspoof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

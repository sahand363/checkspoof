name: Build, Test, and Release CheckSpoof

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Verify, Test & Build on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Format Go Code (gofmt)
        run: |
          gofmt -s -w .

      - name: Run Static Analysis (go vet)
        run: |
          go vet ./...

      - name: Run Automated Unit & Integration Tests (go test)
        run: |
          go test -v -race ./...

      - name: Build Production Binary
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -v -o checkspoof main.go

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: CheckSpoof Enterprise v2.0.${{ github.run_number }}
          files: checkspoof
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

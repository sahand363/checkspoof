name: Build, Test, and Release CheckSpoof

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    name: Verify, Test & Build on Linux
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Check Go formatting (gofmt)
        run: |
          out=$(gofmt -s -l .)
          if [ -n "$out" ]; then echo "Not gofmt-formatted:"; echo "$out"; exit 1; fi

      - name: Check shell scripts
        run: |
          bash -n install.sh
          bash -n spoof-menu.sh

      - name: Run Static Analysis (go vet)
        run: |
          go vet ./...

      - name: Run Automated Unit & Integration Tests (go test)
        run: |
          go test -v -race ./...

      - name: Build Release Binaries
        run: |
          VERSION=2.0.${{ github.run_number }}
          LDFLAGS="-s -w -X main.Version=${VERSION}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "$LDFLAGS" -o checkspoof .
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags "$LDFLAGS" -o checkspoof-arm64 .
          ./checkspoof -version
          sha256sum checkspoof checkspoof-arm64 spoof-menu.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Release to GitHub
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.0.${{ github.run_number }}
          name: CheckSpoof Enterprise v2.0.${{ github.run_number }}
          files: |
            checkspoof
            checkspoof-arm64
            spoof-menu.sh
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build and Release CheckSpoof

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build Binary
        run: |
          go build -o checkspoof main.go

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: checkspoof-binary
          path: checkspoof
